<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Tarocchi Italiani - Lettura dei Tarocchi in Stile Art Nouveau</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quattrocento+Sans:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    
    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
    <script src="https://unpkg.com/splitting@1.0.6/dist/splitting.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    
    <!-- Splitting CSS -->
    <link rel="stylesheet" href="https://unpkg.com/splitting@1.0.6/dist/splitting.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --mystic-purple: #2D1B45;
            --antique-gold: #B8860B;
            --soft-cream: #F5F5DC;
            --rich-burgundy: #800020;
            --muted-teal: #4A6741;
            --warm-amber: #FFBF00;
            --charcoal-gray: #36454F;
        }
        
        body {
            font-family: 'Quattrocento Sans', sans-serif;
            background: linear-gradient(135deg, var(--mystic-purple) 0%, var(--rich-burgundy) 50%, var(--mystic-purple) 100%);
            background-attachment: fixed;
            color: var(--soft-cream);
            overflow-x: hidden;
        }
        
        .mystical-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            background: linear-gradient(45deg, var(--antique-gold), var(--warm-amber), var(--antique-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(184, 134, 11, 0.5);
        }
        
        .card-name {
            font-family: 'MedievalSharp', cursive;
            color: var(--antique-gold);
        }
        
        .mystical-button {
            background: linear-gradient(45deg, var(--antique-gold), var(--warm-amber));
            border: 2px solid var(--antique-gold);
            color: var(--mystic-purple);
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.3);
        }
        
        .mystical-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(184, 134, 11, 0.6);
            background: linear-gradient(45deg, var(--warm-amber), var(--antique-gold));
        }
        
        .tarot-card {
            background: rgba(245, 245, 220, 0.95);
            border: 3px solid var(--antique-gold);
            border-radius: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .tarot-card:hover {
            transform: translateY(-10px) rotateY(5deg);
            box-shadow: 0 20px 40px rgba(184, 134, 11, 0.4);
        }
        
        .tarot-card.flipped {
            transform: rotateY(180deg);
        }
        
        .card-back {
            background: linear-gradient(45deg, var(--mystic-purple), var(--rich-burgundy));
            background-image: url('resources/backgrounds/mystical_bg.png');
            background-size: cover;
            background-position: center;
        }
        
        .reading-area {
            background: rgba(45, 27, 69, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid var(--antique-gold);
            border-radius: 20px;
        }
        
        .particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .glow-text {
            text-shadow: 0 0 10px var(--antique-gold), 0 0 20px var(--antique-gold), 0 0 30px var(--antique-gold);
        }
        
        .typewriter-container {
            min-height: 60px;
        }
        
        .interpretation-card {
            background: rgba(245, 245, 220, 0.95);
            color: var(--mystic-purple);
            border: 2px solid var(--antique-gold);
            border-radius: 15px;
            padding: 20px;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .reading-position {
            text-align: center;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
            color: var(--antique-gold);
            font-weight: 600;
        }
        
        .deck-area {
            perspective: 1000px;
        }
        
        .deck-card {
            position: relative;
            width: 120px;
            height: 200px;
            margin: 0 10px;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        
        .deck-card:hover {
            transform: rotateY(10deg) translateZ(20px);
        }
        
        @media (max-width: 768px) {
            .mystical-title {
                font-size: 2.5rem;
            }
            
            .tarot-card {
                width: 80px;
                height: 120px;
            }
            
            .deck-card {
                width: 80px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- Particle Background -->
    <div class="particle-container" id="particles"></div>
    
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 bg-black bg-opacity-30 backdrop-blur-md border-b border-yellow-600">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <h1 class="mystical-title text-2xl">I Tarocchi Italiani</h1>
                <div class="flex space-x-6">
                    <a href="index.html" class="text-yellow-400 hover:text-yellow-300 transition-colors">Home</a>
                    <a href="reading.html" class="text-yellow-400 hover:text-yellow-300 transition-colors">Lettura</a>
                    <a href="library.html" class="text-yellow-400 hover:text-yellow-300 transition-colors">Libreria</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Hero Section -->
    <section class="min-h-screen flex items-center justify-center pt-20 px-6">
        <div class="text-center max-w-4xl mx-auto">
            <h1 class="mystical-title text-6xl md:text-8xl mb-6 glow-text" data-splitting>
                I Tarocchi Italiani
            </h1>
            <div class="typewriter-container mb-8">
                <p class="text-xl md:text-2xl text-yellow-200" id="typewriter"></p>
            </div>
            <button class="mystical-button px-8 py-4 rounded-full text-xl font-bold" onclick="startReading()">
                Inizia la Lettura
            </button>
        </div>
    </section>
    
    <!-- Reading Interface -->
    <section class="py-20 px-6" id="reading-section" style="display: none;">
        <div class="container mx-auto max-w-6xl">
            <h2 class="mystical-title text-4xl text-center mb-12">Scegli il Tipo di Lettura</h2>
            
            <!-- Reading Type Selector -->
            <div class="flex flex-wrap justify-center gap-4 mb-12">
                <button class="mystical-button px-6 py-3 rounded-full" onclick="selectReadingType('three-card')">
                    Lettura a Tre Carte
                </button>
                <button class="mystical-button px-6 py-3 rounded-full" onclick="selectReadingType('single')">
                    Carta del Giorno
                </button>
                <button class="mystical-button px-6 py-3 rounded-full" onclick="selectReadingType('love')">
                    Amore e Relazioni
                </button>
                <button class="mystical-button px-6 py-3 rounded-full" onclick="selectReadingType('career')">
                    Carriera e Lavoro
                </button>
            </div>
            
            <!-- Card Drawing Area -->
            <div class="reading-area p-8 rounded-3xl">
                <div class="text-center mb-8">
                    <h3 class="card-name text-2xl mb-4" id="reading-title">Mescola le Carte</h3>
                    <p class="text-yellow-200 mb-6" id="reading-description">Clicca sul mazzo per mescolare le carte</p>
                </div>
                
                <!-- Deck Area -->
                <div class="deck-area flex justify-center items-center mb-8" id="deck-area">
                    <div class="deck-card tarot-card card-back" onclick="shuffleDeck()" id="deck">
                        <div class="w-full h-full flex items-center justify-center">
                            <div class="text-yellow-400 text-4xl">✦</div>
                        </div>
                    </div>
                </div>
                
                <!-- Card Positions -->
                <div class="flex flex-wrap justify-center gap-6 mb-8" id="card-positions" style="display: none;">
                    <div class="text-center">
                        <div class="reading-position">Passato</div>
                        <div class="tarot-card w-32 h-48 mx-auto border-dashed" id="position-1" onclick="drawCard(1)">
                            <div class="w-full h-full flex items-center justify-center text-gray-400">
                                <div class="text-2xl">?</div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <div class="reading-position">Presente</div>
                        <div class="tarot-card w-32 h-48 mx-auto border-dashed" id="position-2" onclick="drawCard(2)">
                            <div class="w-full h-full flex items-center justify-center text-gray-400">
                                <div class="text-2xl">?</div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <div class="reading-position">Futuro</div>
                        <div class="tarot-card w-32 h-48 mx-auto border-dashed" id="position-3" onclick="drawCard(3)">
                            <div class="w-full h-full flex items-center justify-center text-gray-400">
                                <div class="text-2xl">?</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Single Card Position -->
                <div class="flex justify-center mb-8" id="single-position" style="display: none;">
                    <div class="text-center">
                        <div class="reading-position" id="single-position-title">La Tua Carta</div>
                        <div class="tarot-card w-32 h-48 mx-auto border-dashed" id="single-card" onclick="drawSingleCard()">
                            <div class="w-full h-full flex items-center justify-center text-gray-400">
                                <div class="text-2xl">?</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Interpretation Area -->
            <div class="mt-12" id="interpretation-area" style="display: none;">
                <h3 class="mystical-title text-3xl text-center mb-8">Interpretazione della Lettura</h3>
                <div id="interpretations"></div>
                <div class="text-center mt-8">
                    <button class="mystical-button px-8 py-4 rounded-full" onclick="saveReading()">
                        Salva Lettura
                    </button>
                    <button class="mystical-button px-8 py-4 rounded-full ml-4" onclick="newReading()">
                        Nuova Lettura
                    </button>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Footer -->
    <footer class="py-12 px-6 border-t border-yellow-600 bg-black bg-opacity-30">
        <div class="container mx-auto text-center">
            <p class="text-yellow-200">© 2024 I Tarocchi Italiani - Arte Divinatoria in Stile Art Nouveau</p>
        </div>
    </footer>
    
    <script src="main.js"></script>
</body>
</html>
