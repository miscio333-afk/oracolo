<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" role="img" aria-label="L'Oracolo di Belline — introduzione animata">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2D1B45"/>
      <stop offset="100%" stop-color="#150D26"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5DC"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#FFBF00"/>
    </linearGradient>
    <linearGradient id="goldFaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFBF00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Raggi celesti rotanti -->
  <g transform="translate(400 250)" opacity="0.5">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(30)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(60)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(90)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(120)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(150)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(180)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(210)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(240)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(270)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(300)"/>
      <line x1="0" y1="-30" x2="0" y2="-240" stroke="#FFBF00" stroke-width="1.5" stroke-opacity="0.18" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Anello sacro -->
  <circle cx="400" cy="250" r="150" fill="none" stroke="url(#goldFaint)" stroke-width="1.5">
    <animate attributeName="r" values="120;165;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="250" r="185" fill="none" stroke="url(#goldFaint)" stroke-width="1">
    <animate attributeName="r" values="160;195;160" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Stella a 8 punte che si disegna -->
  <g filter="url(#glow)">
    <path d="M400 90 L422 190 L520 218 L422 246 L400 346 L378 246 L280 218 L378 190 Z"
          fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"
          stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.4s" begin="0.2s" fill="freeze"/>
    </path>
  </g>
  <path d="M400 90 L422 190 L520 218 L422 246 L400 346 L378 246 L280 218 L378 190 Z"
        fill="url(#gold)" opacity="0">
    <animate attributeName="opacity" from="0" to="0.25" dur="1.2s" begin="2.6s" fill="freeze"/>
  </path>

  <!-- Punto centrale -->
  <circle cx="400" cy="218" r="6" fill="#FFBF00" filter="url(#glow)">
    <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Scintille -->
  <circle cx="300" cy="140" r="3" fill="#FFBF00">
    <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="505" cy="130" r="2.5" fill="#F5F5DC">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="320" r="3" fill="#FFBF00">
    <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="310" r="2.5" fill="#F5F5DC">
    <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="380" r="2" fill="#B8860B">
    <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="120" r="2" fill="#B8860B">
    <animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Titolo -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="3s" fill="freeze"/>
    <text x="400" y="470" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="40" font-weight="700" fill="#F8F4E3" letter-spacing="3">
      L'ORACOLO DI BELLINE
    </text>
    <text x="400" y="512" text-anchor="middle" font-family="Quattrocento Sans, sans-serif" font-size="16" fill="#C9BDD4" letter-spacing="2">
      ART NOUVEAU · 52 LUCI · SETTE SERIE ASTRALI
    </text>
  </g>
</svg>