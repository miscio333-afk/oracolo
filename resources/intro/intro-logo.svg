<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="L'Oracolo di Belline">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5DC"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#FFBF00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stella a 8 punte che si disegna -->
  <g filter="url(#glow)">
    <path d="M120 30 L135 95 L200 110 L135 125 L120 190 L105 125 L40 110 L105 95 Z"
          fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"
          stroke-dasharray="560" stroke-dashoffset="560">
      <animate attributeName="stroke-dashoffset" from="560" to="0" dur="2.2s" begin="0.3s" fill="freeze"/>
    </path>
  </g>
  <path d="M120 30 L135 95 L200 110 L135 125 L120 190 L105 125 L40 110 L105 95 Z"
        fill="url(#gold)" opacity="0">
    <animate attributeName="opacity" from="0" to="0.3" dur="1.2s" begin="2.4s" fill="freeze"/>
  </path>

  <!-- Punto centrale pulsante -->
  <circle cx="120" cy="110" r="5" fill="#FFBF00" filter="url(#glow)">
    <animate attributeName="r" values="3.5;6.5;3.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Scintille -->
  <circle cx="205" cy="60" r="2.5" fill="#FFBF00">
    <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="35" cy="155" r="2.5" fill="#F5F5DC">
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="40" r="2" fill="#B8860B">
    <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="185" r="2" fill="#F5F5DC">
    <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>